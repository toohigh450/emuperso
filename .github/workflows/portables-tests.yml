name: Portables - tests de logique
on:
  pull_request:
    paths:
      - 'portables/**'
      - '.github/workflows/portables-tests.yml'
  push:
    branches: [emulateur-portable]
    paths:
      - 'portables/**'
      - '.github/workflows/portables-tests.yml'
permissions:
  contents: read
jobs:
  logic:
    name: ${{ matrix.os }} - Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    defaults:
      run:
        working-directory: portables
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
